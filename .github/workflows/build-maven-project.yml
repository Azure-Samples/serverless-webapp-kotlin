name: Reusable workflow to build maven project
on:
  workflow_call:
    inputs:
      upload-artifact-key:
        required: false
        type: string
      app-name:
        required: false
        type: string
        default: "pr-build"
jobs:
  build:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          java-version: [11.0.x]
      name: Build with Java ${{ matrix.java-version }}
      env:
        OS: ${{ matrix.os }}
        JAVA_VERSION: ${{ matrix.java-version }}
        FN_APP_NAME: ${{ inputs.app-name }}
      steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
      - name: Build and Test
        working-directory: ./backend/FaceApp
        run: mvn clean install -DappName=$FN_APP_NAME
      - name: Artifact folder for deploy
        if: ${{ inputs.upload-artifact-key != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: .

